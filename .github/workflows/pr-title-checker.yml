name: pr-title-checker

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title
        uses: actions/github-script@v7
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            const title = process.env.PR_TITLE;
            const tagGroup = '(FEAT|FIX|DOCS|STYLE|REFACTOR|PERF|TEST|BUILD|CI|CHORE|REVERT|HOTFIX|BOT)';
            const pattern = new RegExp('^\\[' + tagGroup + '\\] [A-Za-z0-9 _\\-\\.&\\*,\\[\\]:\\/`<>=#\\+]{1,150}$');

            if (title.startsWith('WIP:')) {
              console.log('Skipping validation for WIP PR');
              return;
            }

            if (pattern.test(title)) {
              console.log('PR title validation passed');
              return;
            }

            const startSpaceRe = new RegExp('^\\[' + tagGroup + '\\] ');
            let details = '';
            if (!new RegExp('^\\[' + tagGroup + '\\]').test(title)) {
              details += '- The title does not start with a valid [TAG].\n';
            }
            if (!startSpaceRe.test(title)) {
              details += '- There must be exactly one space after the tag.\n';
            }
            const body = title.replace(startSpaceRe, '');
            if (!/^[A-Za-z0-9 _\-\.&\*,\[\]:\/`<>=#\+]{1,150}$/.test(body)) {
              details += '- The body must be 1-150 English letters, digits, or _-.,&*[]:/`<>=#+\n';
            }
            core.setFailed(
              `PR title must look like "[FEAT] Add Takeout saved-list import".\n` +
              `Tags: FEAT FIX DOCS STYLE REFACTOR PERF TEST BUILD CI CHORE REVERT HOTFIX BOT\n` +
              `Current title: "${title}"\n${details}`
            );
