[project]
name = "dongseon"
version = "0.1.0"
description = "Personal trip planner: pins, stays, flights and opening-hours-aware daily routes"
readme = "README.md"
authors = [
    { name = "Junsoo Kim", email = "kjs40228967@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "httpx>=0.28",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pyyaml>=6.0",
]

[project.scripts]
dongseon = "dongseon.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "respx>=0.22",
    "types-pyyaml>=6.0.12.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dongseon"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
exclude = [
    ".git",
    ".env",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "data",
    "frontend",
]
line-length = 119
indent-width = 4
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
# Google Python Style Guide aligned rule set
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle (Google convention)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T20", # flake8-print
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ERA", # eradicate (commented-out code)
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line too long (formatter handles 119)
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "D104",   # undocumented public package
    "RET504", # unnecessary assignment before return
    "SIM108", # if-else blocks are often more readable than ternaries
    "RUF001", # Korean text may contain ambiguous-looking characters
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["D"]
"alembic/versions/*.py" = ["D"]  # auto-generated migrations

[tool.ruff.lint.isort]
# The repo-root alembic/ migrations directory would otherwise make `alembic` look first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["dongseon", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-ra",
]
testpaths = ["tests/unit_test"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error",
    # Starlette recommends `httpx2` for TestClient; not adopted (unverified package).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
